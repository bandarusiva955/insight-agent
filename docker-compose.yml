services:
  db:
    image: postgres:16-alpine
    container_name: insightagent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: insightagent-app
    profiles: ["app"]   # start with: docker compose --profile app up --build
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network the database is reachable as "db:5432".
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8501:8501"

volumes:
  postgres_data: